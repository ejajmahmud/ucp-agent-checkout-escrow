[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ucp-agent-checkout-escrow"
version = "0.1.0"
description = "Universal Commerce Protocol multi-step cart, idempotency token, and human-approval escrow state machine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
ucp-agent-checkout-escrow = "ucp_agent_checkout_escrow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ucp_agent_checkout_escrow*"]
